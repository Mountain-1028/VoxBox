<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxBox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)"/>
                    <path d="M20 10L15 25H25L20 10Z" fill="white"/>
                    <path d="M20 30L25 15H15L20 30Z" fill="white" opacity="0.7"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#8B5CF6"/>
                            <stop offset="100%" stop-color="#EC4899"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>VoxBox</h1>
            </div>
            <p class="tagline">TikTok & Edge voices for your content</p>
            <button id="settings-btn" class="settings-button" title="Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>

        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="close-settings" class="close-button">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h3>TikTok Authentication</h3>
                        <p class="hint">Required for TikTok voices. Get your session ID from browser cookies.</p>
                        <div class="input-group">
                            <label for="session-id-input">Session ID</label>
                            <input type="password" id="session-id-input" placeholder="Enter TikTok session ID">
                            <button id="toggle-visibility" class="toggle-button" title="Show/Hide">👁️</button>
                        </div>
                        <button id="save-settings" class="btn btn-primary">Save Settings</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="input-section">
                <label for="text-input">Text to speak</label>
                <textarea id="text-input" placeholder="Enter your text here..." rows="8"></textarea>
                <div class="char-count">
                    <span id="char-count">0</span> characters
                </div>
            </div>

            <div class="voice-section">
                <label>Select voice</label>
                <div class="voice-tabs">
                    <button class="tab-btn active" data-tab="tiktok">TikTok</button>
                    <button class="tab-btn" data-tab="edge">Edge TTS</button>
                </div>

                <div id="tiktok-voices" class="voice-grid"></div>
                <div id="edge-voices" class="voice-grid" style="display: none;"></div>
            </div>

            <div class="controls">
                <button id="generate-btn" class="btn btn-primary">
                    <span class="btn-text">Generate</span>
                    <span class="btn-loader" style="display: none;">Generating...</span>
                </button>
                <button id="play-btn" class="btn btn-secondary" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M3 3L12 8L3 13V3Z"/>
                    </svg>
                    Play
                </button>
                <button id="download-btn" class="btn btn-tertiary" disabled>
                    Download
                </button>
            </div>

            <div id="status" class="status"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
